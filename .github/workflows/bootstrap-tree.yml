name: Bootstrap Tree

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - .bootstrap-trigger

permissions:
  contents: write

env:
  ARCHIVE: "https://storage.googleapis.com/vincen-ai/sessions/aSyNcgKIMVufN26oSQvs/outputs/KK5ASFkhTAdmLiFA3FF3/Aegis-Shield-Core-Repo.zip?v=1792979975533"

jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and extract the archive
        run: |
          set -euo pipefail
          curl -fsSL "$ARCHIVE" -o /tmp/tree.zip
          echo "archive bytes: $(stat -c%s /tmp/tree.zip)"
          sha256sum /tmp/tree.zip
          rm -rf /tmp/tree
          mkdir -p /tmp/tree
          unzip -q /tmp/tree.zip -d /tmp/tree
          echo "--- extracted top level ---"
          ls -1 /tmp/tree

      - name: Resolve the app root
        run: |
          set -euo pipefail
          ROOT=""
          while IFS= read -r d; do
            if ls "$d"/public/assets/index-*.js >/dev/null 2>&1; then ROOT="$d"; break; fi
          done < <(find /tmp/tree -name index.html -printf '%h\n' | sort)
          if [ -z "$ROOT" ]; then
            echo "FATAL: no directory holds both index.html and public/assets/index-*.js"
            exit 1
          fi
          echo "APP_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "resolved app root: $ROOT"

      - name: Refuse to commit an archive that is not the fixed tree
        run: |
          set -euo pipefail
          IDX=$(ls "$APP_ROOT"/public/assets/index-*.js | head -n 1)
          echo "index bundle: $(basename "$IDX") = $(stat -c%s "$IDX") bytes"
          sha256sum "$IDX"
          WF="$APP_ROOT/.github/workflows/build-apk.yml"
          if [ ! -f "$WF" ]; then echo "FATAL: archive carries no build-apk.yml"; exit 1; fi
          if ! grep -qi "dex" "$WF"; then echo "FATAL: build-apk.yml has no dex gate"; exit 1; fi
          if ! grep -q "app-debug.apk.sha256" "$WF"; then echo "FATAL: build-apk.yml publishes no checksum asset"; exit 1; fi
          if [ ! -d "$APP_ROOT/native" ]; then echo "FATAL: archive carries no native/ directory"; exit 1; fi
          echo "--- informational presence checks ---"
          for p in android/app/src/main/AndroidManifest.xml android/app/src/main/assets/capacitor.plugins.json capacitor.config.json native/plugins/aegis-keystore; do
            if [ -e "$APP_ROOT/$p" ]; then echo "present: $p"; else echo "MISSING: $p"; fi
          done
          echo "tree file count: $(find "$APP_ROOT" -type f | wc -l)"

      - name: Overlay the whole tree onto main
        run: |
          set -euo pipefail
          rsync -a --delete --exclude '.git' --exclude '.github/workflows/bootstrap-tree.yml' "$APP_ROOT"/ ./
          git config user.name "aegis-bootstrap"
          git config user.email "aegis-bootstrap@users.noreply.github.com"
          git add -A
          echo "--- changed file count ---"
          git diff --cached --name-only | wc -l
          echo "--- staged changes (first 80) ---"
          git status --short | head -80
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "bootstrap: sync repo tree to patched source (native plugins, manifest, dex gate)"
          git push
