name: Bootstrap Tree

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - .bootstrap-trigger

permissions:
  contents: write

env:
  ARCHIVE: "https://storage.googleapis.com/vincen-ai/sessions/aSyNcgKIMVufN26oSQvs/outputs/6Qnt8AwfWcSGIrqpwwbI/Aegis-Shield-Core-Repo.zip?v=1792977707543"
  STALE_INDEX_BYTES: "478904"

jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and extract the archive
        run: |
          set -euo pipefail
          curl -fsSL "$ARCHIVE" -o /tmp/tree.zip
          echo "archive bytes: $(stat -c%s /tmp/tree.zip)"
          sha256sum /tmp/tree.zip
          rm -rf /tmp/tree && mkdir -p /tmp/tree
          unzip -q /tmp/tree.zip -d /tmp/tree
          echo "--- extracted top level ---"
          ls -1 /tmp/tree
          echo "--- every index.html found ---"
          find /tmp/tree -name index.html -print

      - name: Resolve the app root
        run: |
          set -euo pipefail
          ROOT=""
          while IFS= read -r d; do
            if ls "$d"/public/assets/index-*.js >/dev/null 2>&1; then ROOT="$d"; break; fi
          done < <(find /tmp/tree -name index.html -printf '%h\n' | sort)
          if [ -z "$ROOT" ]; then
            echo "FATAL: no directory holds both index.html and public/assets/index-*.js"
            exit 1
          fi
          echo "APP_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "resolved app root: $ROOT"
          ls -1 "$ROOT/public" | head -20

      - name: Verify this is the patched bundle, not the stale one
        run: |
          set -euo pipefail
          IDX=$(ls "$APP_ROOT"/public/assets/index-*.js | head -n 1)
          IDX_SIZE=$(stat -c%s "$IDX")
          ST=$(ls "$APP_ROOT"/public/assets/selftest-*.js 2>/dev/null | head -n 1 || true)
          ST_SIZE=0
          if [ -n "$ST" ]; then ST_SIZE=$(stat -c%s "$ST"); fi
          echo "index bundle:    $(basename "$IDX") = $IDX_SIZE bytes"
          sha256sum "$IDX"
          echo "selftest bundle: ${ST:-none} = $ST_SIZE bytes"
          echo "public file count: $(find "$APP_ROOT/public" -type f | wc -l)"
          if [ "$IDX_SIZE" = "$STALE_INDEX_BYTES" ]; then
            echo "FATAL: archive carries the stale bundle ($IDX_SIZE bytes). Refusing to commit."
            exit 1
          fi
          echo "OK: bundle differs from the known stale one."

      - name: Overlay app files onto main
        run: |
          set -euo pipefail
          mkdir -p public
          rsync -a "$APP_ROOT/public/" public/
          cp "$APP_ROOT/index.html" index.html
          if [ -d "$APP_ROOT/native" ]; then rsync -a "$APP_ROOT/native/" native/; fi
          for f in README.md CHANGELOG.md SECURITY.md LICENSE; do
            if [ -f "$APP_ROOT/$f" ]; then cp "$APP_ROOT/$f" "$f"; fi
          done
          git config user.name "aegis-bootstrap"
          git config user.email "aegis-bootstrap@users.noreply.github.com"
          git add -A
          echo "--- staged changes (first 60) ---"
          git status --short | head -60
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "bootstrap: overlay patched dist bundle from stored archive"
          git push