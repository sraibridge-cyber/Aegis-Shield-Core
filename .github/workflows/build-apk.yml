name: Build AEGIS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-publish
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify the repo's native plugin sources
        run: |
          set -euo pipefail
          missing=0
          for f in \
            native/plugins/aegis-keystore/android/build.gradle \
            native/plugins/aegis-keystore/android/src/main/java/io/aegis/keystore/AegisKeystorePlugin.java \
            native/plugins/aegis-keystore/android/src/main/java/io/aegis/keystore/EcdsaDer.java \
            native/plugins/hull-telemetry/android/build.gradle \
            native/plugins/hull-telemetry/android/src/main/java/io/aegis/telemetry/HullTelemetryPlugin.java; do
            if [ -f "$f" ]; then
              echo "PRESENT: $f"
            else
              echo "ABSENT: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Native plugin sources are missing from main; refusing to build a plugin-less APK."
            exit 1
          fi
          for g in native/plugins/aegis-keystore/android/build.gradle native/plugins/hull-telemetry/android/build.gradle; do
            for need in com.android.library namespace; do
              if grep -q "$need" "$g"; then
                echo "PLUGIN PREREQT OK: $g declares $need"
              else
                echo "::error::$g is missing $need; the build would fail with an opaque Gradle error."
                exit 1
              fi
            done
          done

      - name: Stage the built web bundle
        run: |
          set -euo pipefail
          rm -rf cap
          mkdir -p cap
          cp -r src/web cap/web 2>/dev/null || true
          cp -r public cap/public
          cp package.json cap/package.json 2>/dev/null || true
          ls -la cap

      - name: Assemble the Capacitor webDir
        run: |
          rm -rf cap/www
          mkdir -p cap/www
          cp index.html cap/www/index.html
          cp -r public/. cap/www/
          test -f cap/www/index.html || { echo "::error::cap/www/index.html is missing - the repo-root index.html was not copied"; exit 1; }
          ls cap/www/assets/index-*.js >/dev/null || { echo "::error::cap/www/assets/index-*.js is missing from the shipped bundle"; exit 1; }
          ref=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' index.html | head -n1 || true)
          if [ -n "$ref" ]; then test -f "cap/www/$ref" || { echo "::error::index.html references $ref but that file is not in the packaged webDir"; exit 1; }; echo "entry bundle referenced by index.html: $ref"; fi
          test -f cap/www/manifest.json || { echo "::error::cap/www/manifest.json is missing"; exit 1; }
          test -f cap/www/service-worker.js || { echo "::error::cap/www/service-worker.js is missing - without it the installed app is not offline-capable after the first load, which is a stated promise of the app"; exit 1; }
          echo "ASSEMBLED cap/www:"; ls -la cap/www
          echo "asset count: $(ls cap/www/assets | wc -l)"

      - name: Install Capacitor in an isolated project directory
        working-directory: cap
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/bluetooth-le@6

      - name: Add the Android platform
        working-directory: cap
        run: |
          set -euo pipefail
          REPO_CONFIG="$GITHUB_WORKSPACE/native/capacitor.config.json"
          if [ ! -f "$REPO_CONFIG" ]; then
            echo "::error::native/capacitor.config.json is absent; this workflow will not invent the app identity"
            exit 1
          fi
          cp "$REPO_CONFIG" capacitor.config.json
          echo "using the repo's own capacitor.config.json:"
          cat capacitor.config.json
          node -e 'const fs = require("fs"); const c = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8")); for (const k of ["appId","appName","webDir"]) { if (!c[k] || typeof c[k] !== "string") { console.error("::error::capacitor.config.json has no string " + k); process.exit(1); } } console.log("CONFIG OK: appId=" + c.appId + " appName=" + c.appName + " webDir=" + c.webDir);'
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          echo "--- config actually used for the android project ---"
          cat capacitor.config.json
          node -e 'const fs=require("fs"); const c=JSON.parse(require("fs").readFileSync("capacitor.config.json","utf8")); if (!require("fs").existsSync("android/app/build.gradle")) { console.error("::error::cap/android/app/build.gradle is missing after cap add"); process.exit(1); } const g=require("fs").readFileSync("android/app/build.gradle","utf8"); const m=g.match(/applicationId\s*=?\s*"([^"]+)"/); if (!m) { console.error("::error::no applicationId found in cap/android/app/build.gradle"); process.exit(1); } if (m[1] !== c.appId) { console.error("::error::cap add produced applicationId " + m[1] + " but native/capacitor.config.json says " + c.appId); process.exit(1); } console.log("IDENTITY OK: android applicationId " + m[1] + " matches native/capacitor.config.json");'

      - name: Overlay the repo's native plugin modules and wire them into Gradle
        run: |
          set -euo pipefail
          mkdir -p cap/native
          cp -r native/plugins cap/native/plugins
          echo "modules copied:"
          ls cap/native/plugins
          node <<'NODE'
          const fs = require('fs');
          const settings = 'cap/android/settings.gradle';
          let st = fs.readFileSync(settings, 'utf8');
          const modules = [
            { id: 'aegis-keystore', dir: '../native/plugins/aegis-keystore/android' },
            { id: 'hull-telemetry', dir: '../native/plugins/hull-telemetry/android' }
          ];
          for (const m of modules) {
            if (st.includes("include ':" + m.id + "'")) continue;
            st += "\ninclude ':" + m.id + "'\nproject(':" + m.id + "').projectDir = new File(rootDir, '" + m.dir + "')\n";
          }
          fs.writeFileSync(settings, st);
          const app = 'cap/android/app/build.gradle';
          let s = fs.readFileSync(app, 'utf8');
          if (!s.includes("project(':aegis-keystore')")) {
            const deps = "    implementation project(':aegis-keystore')\n    implementation project(':hull-telemetry')\n";
            if (/dependencies\s*\{/.test(s)) {
              s = s.replace(/dependencies\s*\{/, function (m) { return m + '\n' + deps; });
            } else {
              s += '\ndependencies {\n' + deps + '}\n';
            }
            fs.writeFileSync(app, s);
          }
          const pluginDeps = ['aegis-keystore', 'hull-telemetry'];
          for (const id of pluginDeps) {
            const g = 'cap/native/plugins/' + id + '/android/build.gradle';
            if (!fs.existsSync(g)) continue;
            let t = fs.readFileSync(g, 'utf8');
            if (t.includes("project(':capacitor-android')")) continue;
            t += "\ndependencies {\n    implementation project(':capacitor-android')\n}\n";
            fs.writeFileSync(g, t);
            console.log('patched :capacitor-android dependency into ' + id);
          }
          console.log('gradle wiring written');
          NODE
          echo "--- settings.gradle ---"
          cat cap/android/settings.gradle
          echo "--- app dependencies ---"
          grep -n "project(':" cap/android/app/build.gradle || true

      - name: Overlay the app manifest and plugin registration
        run: |
          set -euo pipefail
          MANIFEST=cap/android/app/src/main/AndroidManifest.xml
          cat > "$MANIFEST" <<'MANIFESTEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" tools:node="remove" />
              <application
                  android:allowBackup="false"
                  android:fullBackupContent="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name=".MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFESTEOF
          python3 - "$MANIFEST" <<'PYEOF'
          import sys
          import xml.etree.ElementTree as ET
          path = sys.argv[1]
          try:
              ET.parse(path)
          except Exception as exc:
              print("::error::the generated AndroidManifest.xml is not well-formed: %s" % exc)
              raise SystemExit(1)
          print("MANIFEST OK: %s parses as well-formed XML" % path)
          PYEOF
          echo "--- permission declarations ---"
          grep -n "uses-permission" "$MANIFEST"
          node <<'NODE'
          const fs = require('fs');
          const p = 'cap/android/app/src/main/assets/capacitor.plugins.json';
          let list = [];
          if (fs.existsSync(p)) {
            const raw = fs.readFileSync(p, 'utf8').trim();
            if (raw) list = JSON.parse(raw);
          }
          const wanted = [
            { pkg: '@capacitor-community/bluetooth-le', classpath: 'com.capacitorjs.community.plugins.bluetoothle.BluetoothLe' },
            { pkg: '@aegis/keystore', classpath: 'io.aegis.keystore.AegisKeystorePlugin' },
            { pkg: '@aegis/hull-telemetry', classpath: 'io.aegis.telemetry.HullTelemetryPlugin' }
          ];
          for (const w of wanted) {
            if (!list.some((e) => e.classpath === w.classpath)) list.push(w);
          }
          fs.writeFileSync(p, JSON.stringify(list, null, 2) + '\n');
          console.log('registered plugin classpaths:');
          for (const e of list) console.log('  ' + e.classpath);
          NODE
          echo "--- plugins.json written above ---"
      - name: Align the minimum SDK with the native modules
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const WANT = 23;
          const candidates = ['cap/android/variables.gradle', 'cap/android/build.gradle', 'cap/android/app/build.gradle'];
          const patched = [];
          for (const p of candidates) {
            if (!fs.existsSync(p)) continue;
            const before = fs.readFileSync(p, 'utf8');
            const after = before.replace(/minSdkVersion(\s*)=?(\s*)(\d+)/g, function (m, a, b, n) {
              if (Number(n) >= WANT) return m;
              return 'minSdkVersion' + a + '=' + b + WANT;
            });
            if (after !== before) {
              fs.writeFileSync(p, after);
              patched.push(p);
              console.log('patched minSdkVersion in ' + p);
            }
          }
          let lowest = null;
          for (const p of candidates) {
            if (!fs.existsSync(p)) continue;
            const s = fs.readFileSync(p, 'utf8');
            for (const line of s.split('\n')) {
              if (/minSdk/.test(line)) console.log('DECLARED ' + p + ': ' + line.trim());
            }
            const re = /minSdkVersion\s*=\s*(\d+)/g;
            let m;
            while ((m = re.exec(s)) !== null) {
              const v = Number(m[1]);
              if (lowest === null || v < lowest) lowest = v;
            }
          }
          if (lowest !== null && lowest < WANT) {
            console.error('MINSDK FAIL: a declared minSdkVersion of ' + lowest + ' is below ' + WANT);
            process.exit(1);
          }
          console.log('MINSDK OK: no declared minSdkVersion below ' + WANT + (patched.length ? ' (patched: ' + patched.join(', ') + ')' : ' (nothing to patch)'));
          NODE
          grep -rn "minSdk" cap/android/variables.gradle cap/android/build.gradle cap/android/app/build.gradle 2>/dev/null || true
      - name: Build the debug APK
        working-directory: cap/android
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unknown} ANDROID_HOME=${ANDROID_HOME:-unset}"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "--- built artefacts ---"
          ls -la app/build/outputs/apk/debug/

      - name: Verify the dex, the plugin registry and the permission surface
        run: |
          set -euo pipefail
          APK=cap/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
          DEX_FILES=$(unzip -Z1 "$APK" | grep -E '^classes[0-9]*\.dex$' || true)
          echo "dex entries: $DEX_FILES"
          fail=0
          for cls in AegisKeystorePlugin HullTelemetryPlugin BluetoothLe; do
            if unzip -p "$APK" 'classes*.dex' | strings | grep -q "$cls"; then
              echo "GATE OK: dex contains $cls"
            else
              echo "GATE FAIL: dex is missing $cls"
              fail=1
            fi
          done
          unzip -p "$APK" assets/capacitor.plugins.json > /tmp/gate-plugins.json
          cat /tmp/gate-plugins.json
          for cls in AegisKeystorePlugin HullTelemetryPlugin BluetoothLe; do
            if grep -q "$cls" /tmp/gate-plugins.json; then
              echo "GATE OK: capacitor.plugins.json lists $cls"
            else
              echo "GATE FAIL: capacitor.plugins.json does not list $cls"
              fail=1
            fi
          done
          set +e
          python3 - <<'PYEOF'
          import json, subprocess
          entries = json.load(open('/tmp/gate-plugins.json'))
          apk = 'cap/android/app/build/outputs/apk/debug/app-debug.apk'
          dex = subprocess.run(['bash', '-lc', "unzip -p '%s' 'classes*.dex' | strings" % apk],
                               capture_output=True, text=True).stdout
          bad = [e['classpath'] for e in entries if e['classpath'].split('.')[-1] not in dex]
          if bad:
              print('GATE FAIL: capacitor.plugins.json registers classpath(s) the dex does not contain: ' + ', '.join(bad))
              raise SystemExit(2)
          print('GATE OK: every registered classpath resolves in the compiled dex (%d entries)' % len(entries))
          PYEOF
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "GATE FAIL: the plugin registry is not consistent with the compiled dex"
            fail=1
          fi

          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT2=$(ls -1 "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1 || true)
          : > gate-permissions.txt
          if [ -n "$AAPT2" ] && [ -x "$AAPT2" ]; then
            echo "reading the merged manifest with $AAPT2"
            "$AAPT2" dump permissions "$APK" >> gate-permissions.txt 2>&1 || true
          fi
          if [ ! -s gate-permissions.txt ]; then
            echo "aapt2 unavailable; reading the binary manifest string pool (both encodings)"
            unzip -p "$APK" AndroidManifest.xml > /tmp/am.bin
            strings -a /tmp/am.bin >> gate-permissions.txt
            strings -a -e l /tmp/am.bin >> gate-permissions.txt
          fi
          echo "--- effective permission surface ---"
          grep -E 'permission|uses-' gate-permissions.txt || true
          echo "------------------------------------"
          if grep -q 'android.permission.BLUETOOTH_SCAN' gate-permissions.txt; then
            echo "GATE OK: BLUETOOTH_SCAN is declared"
          else
            echo "GATE FAIL: BLUETOOTH_SCAN is missing"
            fail=1
          fi
          if grep -q 'android.permission.BLUETOOTH_CONNECT' gate-permissions.txt; then
            echo "GATE FAIL: BLUETOOTH_CONNECT is present; the receive-only policy forbids it"
            fail=1
          else
            echo "GATE OK: BLUETOOTH_CONNECT is absent"
          fi
          REPO_CONFIG="$GITHUB_WORKSPACE/native/capacitor.config.json"
          CONFIG_ID=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).appId)' "$REPO_CONFIG" 2>/dev/null || true)
          BUILT_ID=$(grep -oE 'applicationId[[:space:]]*=?[[:space:]]*"[^"]+"' cap/android/app/build.gradle | head -n1 | sed -E 's/.*"([^"]+)"/\1/' || true)
          if [ -z "$CONFIG_ID" ]; then
            echo "GATE FAIL: native/capacitor.config.json declares no appId, so the built identity cannot be checked"
            fail=1
          elif [ -z "$BUILT_ID" ]; then
            echo "::error::could not read applicationId from cap/android/app/build.gradle"
            fail=1
          elif [ "$BUILT_ID" != "$CONFIG_ID" ]; then
            echo "::error::the project's applicationId ($BUILT_ID) differs from native/capacitor.config.json ($CONFIG_ID)"
            fail=1
          else
            echo "GATE OK: applicationId $BUILT_ID matches native/capacitor.config.json"
          fi
          if [ -n "$AAPT2" ] && [ -x "$AAPT2" ]; then
            APK_PKG=$("$AAPT2" dump badging "$APK" 2>/dev/null | sed -nE "s/^package: name='([^']+)'.*/\1/p" | head -n1)
            if [ -z "$APK_PKG" ]; then
              echo "GATE NOT MEASURED: aapt2 could not read a package name out of the built APK"
            elif [ "$APK_PKG" != "$CONFIG_ID" ]; then
              echo "::error::the packaged APK declares package $APK_PKG but the repo config says $CONFIG_ID"
              fail=1
            else
              echo "GATE OK: the packaged APK declares package $APK_PKG, matching the repo config"
            fi
          else
            echo "GATE NOT MEASURED: aapt2 unavailable, so the packaged package name was not read"
          fi
          echo "--- web asset integrity: what the APK actually ships ---"
          set +e
          python3 - <<'PYEOF'
          import hashlib, json, os, re, sys, zipfile
          apk = 'cap/android/app/build/outputs/apk/debug/app-debug.apk'
          repo_cfg_path = 'native/capacitor.config.json'
          used_cfg_path = 'cap/capacitor.config.json'
          with open(repo_cfg_path) as cfh:
              repo_cfg = json.load(cfh)
          if not os.path.isfile(used_cfg_path):
              print('GATE FAIL: ' + used_cfg_path + ' is absent, so the config the Android project actually used cannot be read; comparing against the repo copy would assume the two are the same file')
              sys.exit(6)
          with open(used_cfg_path) as cfh:
              used_cfg = json.load(cfh)
          if used_cfg != repo_cfg:
              print('GATE FAIL: ' + used_cfg_path + ' differs from ' + repo_cfg_path + ', so the tree the APK was built from and the tree this gate compares are not established to be the same. Built with ' + json.dumps(used_cfg, sort_keys=True) + ' but the repo declares ' + json.dumps(repo_cfg, sort_keys=True))
              sys.exit(6)
          webdir = used_cfg.get('webDir')
          if not webdir:
              print('GATE FAIL: ' + used_cfg_path + ' declares no webDir, so the tree the APK is compared against cannot be identified')
              sys.exit(6)
          src = os.path.join('cap', webdir)
          if not os.path.isdir(src):
              print('GATE FAIL: ' + used_cfg_path + ' declares webDir ' + webdir + ' but ' + src + ' does not exist, so the compared tree is not the tree that was staged into the build')
              sys.exit(6)
          print('staged web tree, derived from ' + used_cfg_path + ' webDir ' + webdir + ': ' + src)
          zf = zipfile.ZipFile(apk)
          names = [n for n in zf.namelist() if not n.endswith('/')]
          html = [n for n in names if n.rsplit('/', 1)[-1] == 'index.html']
          if not html:
              print('GATE FAIL: the APK contains no index.html, so the installed app would open a blank or error shell')
              sys.exit(3)
          # Capacitor for Android maps webDir into assets/public/. That mapping is fixed by Capacitor,
          # so the gate asserts it instead of searching for a prefix that happens to contain an index.html.
          pref = 'assets/public/'
          if not [n for n in html if n.startswith(pref)]:
              print('GATE FAIL: the APK has no index.html at ' + pref + '; the index.html entries it does contain are: ' + ', '.join(sorted(html)) + '. Capacitor serves webDir from ' + pref + ', so the installed app would not find its shell.')
              sys.exit(3)
          strays = sorted(n for n in html if not n.startswith(pref))
          for n in strays:
              if not n.startswith('org/apache/cordova/'):
                  print('GATE FAIL: an index.html outside the web root could act as a second app shell and ship a different app than the one staged: ' + n)
                  sys.exit(3)
          print('web root inside the APK: ' + pref)
          print('index.html entries: %d checked at the web root, %d outside it, all stock cordova-android scaffolding: %s' % (len(html) - len(strays), len(strays), ', '.join(strays) if strays else 'none'))
          packed = {}
          for n in names:
              if not n.startswith(pref):
                  continue
              rel = n[len(pref):]
              if not rel:
                  continue
              packed[rel] = hashlib.sha256(zf.read(n)).hexdigest()
          staged = {}
          for base, _dirs, files in os.walk(src):
              for f in files:
                  full = os.path.join(base, f)
                  rel = os.path.relpath(full, src).replace(os.sep, '/')
                  with open(full, 'rb') as fh:
                      staged[rel] = hashlib.sha256(fh.read()).hexdigest()
          print('staged files: %d | packaged web files: %d' % (len(staged), len(packed)))
          if not staged:
              print('GATE FAIL: ' + src + ' contains no files, so comparing it against the APK would assert nothing')
              sys.exit(4)
          missing = sorted(set(staged) - set(packed))
          differing = sorted(k for k in staged if k in packed and staged[k] != packed[k])
          extra = sorted(set(packed) - set(staged))
          # Capacitor injects exactly these two bridge files into the web root on every sync and they are
          # not part of the staged bundle. Every other packaged file must have come from the staged tree,
          # so the remainder is asserted rather than printed as a note.
          INJECTED = {'cordova.js', 'cordova_plugins.js'}
          unexpected = [k for k in extra if k not in INJECTED]
          if missing:
              print('GATE FAIL: staged but absent from the APK (%d): ' % len(missing) + ', '.join(missing[:10]))
          if differing:
              print('GATE FAIL: content differs between ' + src + ' and the APK (%d): ' % len(differing) + ', '.join(differing[:10]))
          if unexpected:
              print('GATE FAIL: the APK ships web-root files that were never staged (%d): ' % len(unexpected) + ', '.join(unexpected[:10]) + '. Only the Capacitor bridge files ' + ', '.join(sorted(INJECTED)) + ' may appear without being staged.')
          EMPTY_SHA = 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
          # The two Capacitor bridge files are empty placeholders in this build. A non-empty one is
          # script the WebView can execute and that never came through the staged tree, so it must be
          # pinned deliberately instead of passing on its filename alone.
          carrying = [k for k in extra if k in INJECTED and packed[k] != EMPTY_SHA]
          if extra:
              print('packaged files not staged, all Capacitor bridge injections: ' + ', '.join('%s (sha256 %s)' % (k, packed[k]) for k in extra))
          if carrying:
              print('GATE FAIL: the Capacitor bridge files are empty placeholders in this build, but these carry content the WebView could execute and that was never staged: ' + ', '.join('%s (sha256 %s)' % (k, packed[k]) for k in carrying) + '. Pin and review that content deliberately before allowing it through.')
          if missing or differing or unexpected or carrying:
              sys.exit(4)
          entry = None
          with open(os.path.join(src, 'index.html'), 'r', encoding='utf-8', errors='replace') as fh:
              m = re.search(r'assets/index-[A-Za-z0-9_-]+[.]js', fh.read())
              entry = m.group(0) if m else None
          if entry is None:
              print('GATE NOT MEASURED: ' + src + '/index.html names no entry bundle matching assets/index-*.js')
          elif entry not in packed:
              print('GATE FAIL: index.html loads ' + entry + ' but that file is not inside the APK')
              sys.exit(5)
          else:
              print('GATE OK: the APK ships ' + entry + ' with sha256 ' + packed[entry])
          print('GATE OK: every staged web asset is present inside the APK and byte-identical (%d staged files, %d packaged, %d Capacitor bridge files accounted for)' % (len(staged), len(packed), len(extra)))
          PYEOF
          WEB_RC=$?
          set -e
          if [ "$WEB_RC" -ne 0 ]; then
            echo "::error::The APK does not carry the staged web bundle; refusing to publish an app that would open blank."
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::Gate failed; nothing will be published."
            echo "GATE RESULT: FAIL"
            exit 1
          fi
          echo "GATE RESULT: PASS"

      - name: Package the APK and its checksum
        run: |
          set -euo pipefail
          APK=cap/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          rm -rf dist
          mkdir -p dist
          cp "$APK" dist/app-debug.apk
          APK_SIZE=$(stat -c%s dist/app-debug.apk)
          APK_HASH=$(sha256sum dist/app-debug.apk | cut -d' ' -f1)
          printf 'sha256:%s  app-debug.apk\nbytes:%s\n' "$APK_HASH" "$APK_SIZE" > dist/app-debug.apk.sha256
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "APK_SIZE=$APK_SIZE" >> "$GITHUB_ENV"
          echo "APK_HASH=$APK_HASH" >> "$GITHUB_ENV"
          ls -la dist
          echo "PACKAGED: dist/app-debug.apk $APK_SIZE bytes sha256 $APK_HASH"
          cat dist/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-debug-apk
          path: |
            dist/app-debug.apk
            dist/app-debug.apk.sha256
            gate-permissions.txt
      - name: Publish without destroying the copy that is live
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=dist/app-debug.apk
          SUM=dist/app-debug.apk.sha256
          test -f "$APK"
          test -f "$SUM"
          test -n "${APK_HASH:-}"
          NONREPRO="Builds are not bit-reproducible: identical app sources can produce different bytes, so this sha256 identifies the published file and does not prove it can be rebuilt from this commit."
          echo "this build: $APK_SIZE bytes, sha256 $APK_HASH"
          LIVE_STAMP=""
          PREV_RECORDED_SHA=""
          if gh release view apk-latest >/dev/null 2>&1; then
            LIVE_BODY=$(gh release view apk-latest --json body --jq '.body')
            LIVE_STAMP=$(printf '%s\n' "$LIVE_BODY" | grep -oE 'AUTHORITATIVE BUILD TIME: [0-9]{8}T[0-9]{6}Z' | head -n1 | sed 's/^AUTHORITATIVE BUILD TIME: //' || true)
            PREV_RECORDED_SHA=$(printf '%s\n' "$LIVE_BODY" | grep -oE 'Git commit: [0-9a-f]{40}' | head -n1 | sed 's/^Git commit: //' || true)
            # apk-latest writes its body as a single prose line, so the commit cannot be found by an
            # anchored ^Git commit: match. Search the body for the pattern instead; without this the
            # archive attribution below always degraded to NOT RECORDED even when the commit was recorded.
            echo "apk-latest records build time ${LIVE_STAMP:-NOT RECORDED} from commit ${PREV_RECORDED_SHA:-NOT RECORDED}"
            if [ -z "$PREV_RECORDED_SHA" ]; then
              echo "::warning::apk-latest body carries no parseable 'Git commit: <sha>' record, so the superseded binary's builder commit cannot be attributed"
            fi
            if [ -n "$LIVE_STAMP" ] && [ "$LIVE_STAMP" \> "$STAMP" ]; then
              echo "::error::apk-latest already serves the newer build $LIVE_STAMP; this build is $STAMP. Refusing to move the public download backwards to older code."
              exit 1
            fi
          fi
          if gh release view apk-latest >/dev/null 2>&1; then
            mkdir -p prev
            if gh release download apk-latest --pattern app-debug.apk --dir prev --clobber; then
              PREV_HASH=$(sha256sum prev/app-debug.apk | cut -d' ' -f1)
              PREV_SIZE=$(stat -c%s prev/app-debug.apk)
              PREV_TAG="apk-prev-${PREV_HASH:0:12}"
              if [ "$PREV_HASH" = "$APK_HASH" ]; then
                echo "SUPERSEDED: apk-latest already serves this build (sha256 $PREV_HASH); nothing to preserve"
              elif gh release view "$PREV_TAG" >/dev/null 2>&1; then
                echo "PRESERVED ALREADY: $PREV_TAG (sha256 $PREV_HASH)"
              else
                HOLDER=""
                for t in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
                  if [ "$t" = "apk-latest" ]; then continue; fi
                  if gh release view "$t" --json body --jq '.body' 2>/dev/null | grep -q "$PREV_HASH"; then HOLDER="$t"; break; fi
                done
                if [ -n "$HOLDER" ]; then
                  echo "PRESERVED ALREADY: $HOLDER holds sha256 $PREV_HASH; not storing a duplicate copy"
                else
                  printf 'sha256:%s  app-debug.apk\nbytes:%s\n' "$PREV_HASH" "$PREV_SIZE" > prev/app-debug.apk.sha256
                  if [ -n "$PREV_RECORDED_SHA" ]; then
                    gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${PREV_TAG}" -f "sha=${PREV_RECORDED_SHA}" >/dev/null
                    echo "ATTRIBUTED: ${PREV_TAG} created at ${PREV_RECORDED_SHA}, the commit apk-latest itself recorded as the builder of this binary"
                    PREV_ATTRIBUTION="Built from commit $PREV_RECORDED_SHA, as recorded by apk-latest while this binary was the current download."
                  else
                    PREV_ATTRIBUTION="Builder commit NOT RECORDED: this binary predates per-release commit stamping. The tag points at the archiving run's commit $GITHUB_SHA and is NOT evidence of which source produced this binary."
                    echo "::warning::no recorded builder commit for sha256 $PREV_HASH; the archive tag is not provenance"
                  fi
                  gh release create "$PREV_TAG" prev/app-debug.apk prev/app-debug.apk.sha256 --prerelease --title "AEGIS debug APK - superseded build (sole copy)" --notes "Superseded build preserved verbatim for history. sha256 $PREV_HASH, $PREV_SIZE bytes. This is the ONLY copy of this binary in the repository. Not the current download; the current build is on apk-latest. $PREV_ATTRIBUTION"
                  PREV_DRAFT=$(gh release view "$PREV_TAG" --json isDraft --jq '.isDraft')
                  if [ "$PREV_DRAFT" = "true" ]; then
                    echo "::error::$PREV_TAG was created as a draft, so its assets are not publicly downloadable and the archive defeats its own purpose"
                    exit 1
                  fi
                  echo "PRESERVED: superseded build archived as $PREV_TAG (sha256 $PREV_HASH), attribution: ${PREV_RECORDED_SHA:-NOT RECORDED}"
                fi
              fi
            else
              echo "::warning::apk-latest carries no app-debug.apk, so there was nothing to preserve"
            fi
          fi
          TAG="apk-$STAMP"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUM" --clobber
          else
            gh release create "$TAG" "$APK" "$SUM" --target "$GITHUB_SHA" --prerelease --title "AEGIS debug APK $STAMP" --notes "Debug-signed APK built from $GITHUB_SHA by workflow run $GITHUB_RUN_ID. sha256 $APK_HASH, $APK_SIZE bytes. This is the permanent record for this build: apk-latest moves on to later builds, this tag does not. ${NONREPRO}"
          fi
          echo "ARCHIVED: $TAG"
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest "$APK" "$SUM" --clobber
            gh release edit apk-latest --title "AEGIS debug APK (latest build, built $STAMP)" --notes "AUTHORITATIVE BUILD TIME: $STAMP. Git commit: $GITHUB_SHA. Workflow run: $GITHUB_RUN_ID. Web assets are bundled inside the APK, so it works offline. The debug signature identifies no publisher. sha256 $APK_HASH, $APK_SIZE bytes. NOTE: this release is updated in place, so GitHub's published date is when it was first published and does not move when the asset is replaced; that date is older than this binary. The build time in this title is authoritative. The apk-latest tag is moved to the build commit on every publish, so cloning at that tag returns the source this binary was built from. ${NONREPRO}"
          else
            gh release create apk-latest "$APK" "$SUM" --target $GITHUB_SHA --title "AEGIS debug APK (latest build, built $STAMP)" --notes "AUTHORITATIVE BUILD TIME: $STAMP. Git commit: $GITHUB_SHA. Workflow run: $GITHUB_RUN_ID. Web assets are bundled inside the APK, so it works offline. The debug signature identifies no publisher. sha256 $APK_HASH, $APK_SIZE bytes. This release was created together with this binary, so its published date is accurate. ${NONREPRO}"
          fi
          mkdir -p verify
          gh release download apk-latest --pattern app-debug.apk --dir verify --clobber
          GOT=$(sha256sum verify/app-debug.apk | cut -d' ' -f1)
          if [ "$GOT" != "$APK_HASH" ]; then
            echo "::error::apk-latest serves sha256 $GOT but the gated build is $APK_HASH"
            exit 1
          fi
          echo "PUBLISH VERIFIED: apk-latest serves app-debug.apk sha256 $GOT"
          gh release download apk-latest --pattern app-debug.apk.sha256 --dir verify --clobber
          SUM_GOT=$(grep -oE '[0-9a-f]{64}' verify/app-debug.apk.sha256 | head -n1 || true)
          if [ "$SUM_GOT" != "$APK_HASH" ]; then
            echo "::error::apk-latest serves app-debug.apk.sha256 recording ${SUM_GOT:-NO HASH} but the gated build is $APK_HASH, so the published checksum does not describe the published binary and anyone verifying the download would be misled"
            exit 1
          fi
          echo "CHECKSUM VERIFIED: apk-latest serves app-debug.apk.sha256 recording $SUM_GOT, which matches the gated binary"
          git tag -f apk-latest "$GITHUB_SHA"
          if ! git push --force origin refs/tags/apk-latest; then
            echo "::error::could not move the apk-latest tag ref to $GITHUB_SHA"
            exit 1
          fi
          MOVED=$(git ls-remote origin refs/tags/apk-latest | cut -f1)
          if [ "$MOVED" != "$GITHUB_SHA" ]; then
            echo "::error::apk-latest resolves to $MOVED remotely but this build is $GITHUB_SHA"
            exit 1
          fi
          echo "TAG REF VERIFIED: apk-latest resolves to $MOVED, so the tag names the source this binary was built from"
