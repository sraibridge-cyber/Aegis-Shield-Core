name: Build AEGIS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify the repo's native plugin sources
        run: |
          set -euo pipefail
          missing=0
          for f in \
            native/plugins/aegis-keystore/android/build.gradle \
            native/plugins/aegis-keystore/android/src/main/java/io/aegis/keystore/AegisKeystorePlugin.java \
            native/plugins/aegis-keystore/android/src/main/java/io/aegis/keystore/EcdsaDer.java \
            native/plugins/hull-telemetry/android/build.gradle \
            native/plugins/hull-telemetry/android/src/main/java/io/aegis/telemetry/HullTelemetryPlugin.java; do
            if [ -f "$f" ]; then
              echo "PRESENT: $f"
            else
              echo "ABSENT: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Native plugin sources are missing from main; refusing to build a plugin-less APK."
            exit 1
          fi
          for g in native/plugins/aegis-keystore/android/build.gradle native/plugins/hull-telemetry/android/build.gradle; do
            for need in com.android.library namespace; do
              if grep -q "$need" "$g"; then
                echo "PLUGIN PREREQT OK: $g declares $need"
              else
                echo "::error::$g is missing $need; the build would fail with an opaque Gradle error."
                exit 1
              fi
            done
          done

      - name: Stage the built web bundle
        run: |
          set -euo pipefail
          rm -rf cap
          mkdir -p cap
          cp -r src/web cap/web 2>/dev/null || true
          cp -r public cap/public
          cp package.json cap/package.json 2>/dev/null || true
          ls -la cap

      - name: Assemble the Capacitor webDir
        run: |
          rm -rf cap/www
          mkdir -p cap/www
          cp index.html cap/www/index.html
          cp -r public/. cap/www/
          test -f cap/www/index.html || { echo "::error::cap/www/index.html is missing - the repo-root index.html was not copied"; exit 1; }
          ls cap/www/assets/index-*.js >/dev/null || { echo "::error::cap/www/assets/index-*.js is missing from the shipped bundle"; exit 1; }
          ref=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' index.html | head -n1 || true)
          if [ -n "$ref" ]; then test -f "cap/www/$ref" || { echo "::error::index.html references $ref but that file is not in the packaged webDir"; exit 1; }; echo "entry bundle referenced by index.html: $ref"; fi
          test -f cap/www/manifest.json || { echo "::error::cap/www/manifest.json is missing"; exit 1; }
          test -f cap/www/service-worker.js || echo "::warning::cap/www/service-worker.js is missing"
          echo "ASSEMBLED cap/www:"; ls -la cap/www
          echo "asset count: $(ls cap/www/assets | wc -l)"

      - name: Install Capacitor in an isolated project directory
        working-directory: cap
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/bluetooth-le@6

      - name: Add the Android platform
        working-directory: cap
        run: |
          npx cap init AEGIS com.aegis.shield --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Overlay the repo's native plugin modules and wire them into Gradle
        run: |
          set -euo pipefail
          mkdir -p cap/native
          cp -r native/plugins cap/native/plugins
          echo "modules copied:"
          ls cap/native/plugins
          node <<'NODE'
          const fs = require('fs');
          const settings = 'cap/android/settings.gradle';
          let st = fs.readFileSync(settings, 'utf8');
          const modules = [
            { id: 'aegis-keystore', dir: '../native/plugins/aegis-keystore/android' },
            { id: 'hull-telemetry', dir: '../native/plugins/hull-telemetry/android' }
          ];
          for (const m of modules) {
            if (st.includes("include ':" + m.id + "'")) continue;
            st += "\ninclude ':" + m.id + "'\nproject(':" + m.id + "').projectDir = new File(rootDir, '" + m.dir + "')\n";
          }
          fs.writeFileSync(settings, st);
          const app = 'cap/android/app/build.gradle';
          let s = fs.readFileSync(app, 'utf8');
          if (!s.includes("project(':aegis-keystore')")) {
            const deps = "    implementation project(':aegis-keystore')\n    implementation project(':hull-telemetry')\n";
            if (/dependencies\s*\{/.test(s)) {
              s = s.replace(/dependencies\s*\{/, function (m) { return m + '\n' + deps; });
            } else {
              s += '\ndependencies {\n' + deps + '}\n';
            }
            fs.writeFileSync(app, s);
          }
          const pluginDeps = ['aegis-keystore', 'hull-telemetry'];
          for (const id of pluginDeps) {
            const g = 'cap/native/plugins/' + id + '/android/build.gradle';
            if (!fs.existsSync(g)) continue;
            let t = fs.readFileSync(g, 'utf8');
            if (t.includes("project(':capacitor-android')")) continue;
            t += "\ndependencies {\n    implementation project(':capacitor-android')\n}\n";
            fs.writeFileSync(g, t);
            console.log('patched :capacitor-android dependency into ' + id);
          }
          console.log('gradle wiring written');
          NODE
          echo "--- settings.gradle ---"
          cat cap/android/settings.gradle
          echo "--- app dependencies ---"
          grep -n "project(':" cap/android/app/build.gradle || true

      - name: Overlay the app manifest and plugin registration
        run: |
          set -euo pipefail
          MANIFEST=cap/android/app/src/main/AndroidManifest.xml
          cat > "$MANIFEST" <<'MANIFESTEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" tools:node="remove" />
              <application
                  android:allowBackup="false"
                  android:fullBackupContent="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name=".MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFESTEOF
          python3 - "$MANIFEST" <<'PYEOF'
          import sys
          import xml.etree.ElementTree as ET
          path = sys.argv[1]
          try:
              ET.parse(path)
          except Exception as exc:
              print("::error::the generated AndroidManifest.xml is not well-formed: %s" % exc)
              raise SystemExit(1)
          print("MANIFEST OK: %s parses as well-formed XML" % path)
          PYEOF
          echo "--- permission declarations ---"
          grep -n "uses-permission" "$MANIFEST"
          node <<'NODE'
          const fs = require('fs');
          const p = 'cap/android/app/src/main/assets/capacitor.plugins.json';
          let list = [];
          if (fs.existsSync(p)) {
            const raw = fs.readFileSync(p, 'utf8').trim();
            if (raw) list = JSON.parse(raw);
          }
          const wanted = [
            { pkg: '@capacitor-community/bluetooth-le', classpath: 'com.capacitorjs.community.bluetoothle.BluetoothLePlugin' },
            { pkg: '@aegis/keystore', classpath: 'io.aegis.keystore.AegisKeystorePlugin' },
            { pkg: '@aegis/hull-telemetry', classpath: 'io.aegis.telemetry.HullTelemetryPlugin' }
          ];
          for (const w of wanted) {
            if (!list.some((e) => e.classpath === w.classpath)) list.push(w);
          }
          fs.writeFileSync(p, JSON.stringify(list, null, 2) + '\n');
          console.log('registered plugin classpaths:');
          for (const e of list) console.log('  ' + e.classpath);
          NODE
          echo "--- plugins.json written above ---"
      - name: Align the minimum SDK with the native modules
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const WANT = 23;
          const candidates = ['cap/android/variables.gradle', 'cap/android/build.gradle', 'cap/android/app/build.gradle'];
          const patched = [];
          for (const p of candidates) {
            if (!fs.existsSync(p)) continue;
            const before = fs.readFileSync(p, 'utf8');
            const after = before.replace(/minSdkVersion(\s*)=?(\s*)(\d+)/g, function (m, a, b, n) {
              if (Number(n) >= WANT) return m;
              return 'minSdkVersion' + a + '=' + b + WANT;
            });
            if (after !== before) {
              fs.writeFileSync(p, after);
              patched.push(p);
              console.log('patched minSdkVersion in ' + p);
            }
          }
          let lowest = null;
          for (const p of candidates) {
            if (!fs.existsSync(p)) continue;
            const s = fs.readFileSync(p, 'utf8');
            for (const line of s.split('\n')) {
              if (/minSdk/.test(line)) console.log('DECLARED ' + p + ': ' + line.trim());
            }
            const re = /minSdkVersion\s*=\s*(\d+)/g;
            let m;
            while ((m = re.exec(s)) !== null) {
              const v = Number(m[1]);
              if (lowest === null || v < lowest) lowest = v;
            }
          }
          if (lowest !== null && lowest < WANT) {
            console.error('MINSDK FAIL: a declared minSdkVersion of ' + lowest + ' is below ' + WANT);
            process.exit(1);
          }
          console.log('MINSDK OK: no declared minSdkVersion below ' + WANT + (patched.length ? ' (patched: ' + patched.join(', ') + ')' : ' (nothing to patch)'));
          NODE
          grep -rn "minSdk" cap/android/variables.gradle cap/android/build.gradle cap/android/app/build.gradle 2>/dev/null || true
      - name: Build the debug APK
        working-directory: cap/android
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unknown} ANDROID_HOME=${ANDROID_HOME:-unset}"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "--- built artefacts ---"
          ls -la app/build/outputs/apk/debug/

      - name: Verify the dex, the plugin registry and the permission surface
        run: |
          set -euo pipefail
          APK=cap/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
          DEX_FILES=$(unzip -Z1 "$APK" | grep -E '^classes[0-9]*\.dex$' || true)
          echo "dex entries: $DEX_FILES"
          fail=0
          for cls in AegisKeystorePlugin HullTelemetryPlugin BluetoothLePlugin; do
            if unzip -p "$APK" 'classes*.dex' | strings | grep -q "$cls"; then
              echo "GATE OK: dex contains $cls"
            else
              echo "GATE FAIL: dex is missing $cls"
              fail=1
            fi
          done
          unzip -p "$APK" assets/capacitor.plugins.json > /tmp/gate-plugins.json
          cat /tmp/gate-plugins.json
          for cls in AegisKeystorePlugin HullTelemetryPlugin BluetoothLePlugin; do
            if grep -q "$cls" /tmp/gate-plugins.json; then
              echo "GATE OK: capacitor.plugins.json lists $cls"
            else
              echo "GATE FAIL: capacitor.plugins.json does not list $cls"
              fail=1
            fi
          done
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT2=$(ls -1 "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1 || true)
          : > gate-permissions.txt
          if [ -n "$AAPT2" ] && [ -x "$AAPT2" ]; then
            echo "reading the merged manifest with $AAPT2"
            "$AAPT2" dump permissions "$APK" >> gate-permissions.txt 2>&1 || true
          fi
          if [ ! -s gate-permissions.txt ]; then
            echo "aapt2 unavailable; reading the binary manifest string pool (both encodings)"
            unzip -p "$APK" AndroidManifest.xml > /tmp/am.bin
            strings -a /tmp/am.bin >> gate-permissions.txt
            strings -a -e l /tmp/am.bin >> gate-permissions.txt
          fi
          echo "--- effective permission surface ---"
          grep -E 'permission|uses-' gate-permissions.txt || true
          echo "------------------------------------"
          if grep -q 'android.permission.BLUETOOTH_SCAN' gate-permissions.txt; then
            echo "GATE OK: BLUETOOTH_SCAN is declared"
          else
            echo "GATE FAIL: BLUETOOTH_SCAN is missing"
            fail=1
          fi
          if grep -q 'android.permission.BLUETOOTH_CONNECT' gate-permissions.txt; then
            echo "GATE FAIL: BLUETOOTH_CONNECT is present; the receive-only policy forbids it"
            fail=1
          else
            echo "GATE OK: BLUETOOTH_CONNECT is absent"
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::Gate failed; nothing will be published."
            echo "GATE RESULT: FAIL"
            exit 1
          fi
          echo "GATE RESULT: PASS"

      - name: Package the APK and its checksum
        run: |
          set -euo pipefail
          APK=cap/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          rm -rf dist
          mkdir -p dist
          cp "$APK" dist/app-debug.apk
          APK_SIZE=$(stat -c%s dist/app-debug.apk)
          APK_HASH=$(sha256sum dist/app-debug.apk | cut -d' ' -f1)
          printf 'sha256:%s  app-debug.apk\nbytes:%s\n' "$APK_HASH" "$APK_SIZE" > dist/app-debug.apk.sha256
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "APK_SIZE=$APK_SIZE" >> "$GITHUB_ENV"
          echo "APK_HASH=$APK_HASH" >> "$GITHUB_ENV"
          ls -la dist
          echo "PACKAGED: dist/app-debug.apk $APK_SIZE bytes sha256 $APK_HASH"
          cat dist/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-debug-apk
          path: |
            dist/app-debug.apk
            dist/app-debug.apk.sha256
            gate-permissions.txt
      - name: Publish without destroying the copy that is live
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=dist/app-debug.apk
          SUM=dist/app-debug.apk.sha256
          test -f "$APK"
          test -f "$SUM"
          test -n "${APK_HASH:-}"
          echo "this build: $APK_SIZE bytes, sha256 $APK_HASH"
          if gh release view apk-latest >/dev/null 2>&1; then
            mkdir -p prev
            if gh release download apk-latest --pattern app-debug.apk --dir prev --clobber; then
              PREV_HASH=$(sha256sum prev/app-debug.apk | cut -d' ' -f1)
              PREV_SIZE=$(stat -c%s prev/app-debug.apk)
              PREV_TAG="apk-prev-${PREV_HASH:0:12}"
              if gh release view "$PREV_TAG" >/dev/null 2>&1; then
                echo "PRESERVED ALREADY: $PREV_TAG (sha256 $PREV_HASH)"
              else
                printf 'sha256:%s  app-debug.apk\nbytes:%s\n' "$PREV_HASH" "$PREV_SIZE" > prev/app-debug.apk.sha256
                gh release create "$PREV_TAG" prev/app-debug.apk prev/app-debug.apk.sha256 --prerelease --title "AEGIS debug APK - superseded build" --notes "Superseded build preserved verbatim for history. sha256 $PREV_HASH, $PREV_SIZE bytes. Not the current download; the current build is on apk-latest."
                echo "PRESERVED: superseded build archived as $PREV_TAG (sha256 $PREV_HASH)"
              fi
            else
              echo "::warning::apk-latest carries no app-debug.apk, so there was nothing to preserve"
            fi
          fi
          TAG="apk-$STAMP"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUM" --clobber
          else
            gh release create "$TAG" "$APK" "$SUM" --target "$GITHUB_SHA" --prerelease --title "AEGIS debug APK $STAMP" --notes "Debug-signed APK built from $GITHUB_SHA by workflow run $GITHUB_RUN_ID. sha256 $APK_HASH, $APK_SIZE bytes."
          fi
          echo "ARCHIVED: $TAG"
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest "$APK" "$SUM" --clobber
            gh release edit apk-latest --title "AEGIS debug APK (latest build)" --notes "Debug-signed APK built from $GITHUB_SHA by workflow run $GITHUB_RUN_ID. Web assets are bundled inside the APK, so it works offline. The debug signature identifies no publisher. sha256 $APK_HASH, $APK_SIZE bytes."
          else
            gh release create apk-latest "$APK" "$SUM" --target $GITHUB_SHA --title "AEGIS debug APK (latest build)" --notes "Debug-signed APK built from $GITHUB_SHA by workflow run $GITHUB_RUN_ID. sha256 $APK_HASH, $APK_SIZE bytes."
          fi
          mkdir -p verify
          gh release download apk-latest --pattern app-debug.apk --dir verify --clobber
          GOT=$(sha256sum verify/app-debug.apk | cut -d' ' -f1)
          if [ "$GOT" != "$APK_HASH" ]; then
            echo "::error::apk-latest serves sha256 $GOT but the gated build is $APK_HASH"
            exit 1
          fi
          echo "PUBLISH VERIFIED: apk-latest serves app-debug.apk sha256 $GOT"
