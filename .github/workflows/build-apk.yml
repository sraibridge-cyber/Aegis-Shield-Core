name: Build AEGIS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Stage the built web bundle
        run: |
          set -euo pipefail
          rm -rf cap
          mkdir -p cap/www
          cp index.html cap/www/
          cp -r public/. cap/www/
          test -f cap/www/index.html
          test -f cap/www/manifest.json
          test -f cap/www/service-worker.js
          test -d cap/www/icons
          ls cap/www/assets/index-*.js >/dev/null
          echo "staged files: $(find cap/www -type f | wc -l)"

      - name: Install Capacitor in an isolated project directory
        working-directory: cap
        run: |
          npm init -y
          npm install --no-audit --no-fund --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/bluetooth-le@6

      - name: Add the Android platform
        working-directory: cap
        run: |
          npx cap init AEGIS com.aegis.shield --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Confirm assets were bundled into the APK
        working-directory: cap
        run: |
          test -f android/app/src/main/assets/public/index.html
          test -d android/app/src/main/assets/public/assets
          echo "bundled assets: $(find android/app/src/main/assets/public -type f | wc -l)"

      - name: Build debug APK
        working-directory: cap
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: aegis-debug-apk
          path: cap/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest "cap/android/app/build/outputs/apk/debug/app-debug.apk#aegis-debug.apk" --title "AEGIS debug APK (latest build)" --notes "Debug-signed Android package built from main. Web assets are bundled inside the APK, so it runs with the network off. Debug signature identifies no publisher."
