name: Android monitor

# Builds the AEGIS Monitor debug APK and the CSS Labs Android SDK AAR, runs the unit
# tests, checks the built APK's permissions, and uploads everything as WORKFLOW
# ARTIFACTS. This workflow never creates a GitHub Release or a tag. A draft
# pre-release is made by hand after review (see docs/ANDROID.md).

on:
  push:
    branches: [ feat/aegis-android, feat/css-android-sdk ]
    paths:
      - 'android-monitor/**'
      - 'csslabs-sdk/**'
      - 'public/monitor/**'
      - 'test/monitor/**'
      - 'scripts/check-android-privacy.sh'
      - '.github/workflows/android-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Monitor tests (hash chain, consent, signal changes)
        run: node --test test/monitor/*.test.mjs

  android-debug:
    runs-on: ubuntu-latest
    needs: web-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Kotlin unit tests (app and SDK), debug APK, and SDK AAR
        run: gradle -p android-monitor :csslabs-sdk:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :csslabs-sdk:assembleRelease --no-daemon
      - name: Privacy checks (manifest, web files, sources, dependencies)
        run: bash scripts/check-android-privacy.sh
      - name: Check the built APK's permissions (must not declare INTERNET)
        run: |
          set -euo pipefail
          APK=android-monitor/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT2="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -x "$AAPT2"
          "$AAPT2" dump permissions "$APK" | tee apk-permissions.txt
          if grep -q 'android.permission.INTERNET' apk-permissions.txt; then
            echo "::error::the built APK declares android.permission.INTERNET"
            exit 1
          fi
          echo "PASS: the built APK declares no INTERNET permission"
      - name: Checksums
        run: |
          set -euo pipefail
          cd android-monitor/app/build/outputs/apk/debug
          sha256sum app-debug.apk | tee app-debug.apk.sha256
          cd "$GITHUB_WORKSPACE/csslabs-sdk/build/outputs/aar"
          sha256sum csslabs-sdk-release.aar | tee csslabs-sdk-release.aar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-monitor-debug-apk
          path: |
            android-monitor/app/build/outputs/apk/debug/app-debug.apk
            android-monitor/app/build/outputs/apk/debug/app-debug.apk.sha256
            apk-permissions.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: csslabs-sdk-aar
          path: |
            csslabs-sdk/build/outputs/aar/csslabs-sdk-release.aar
            csslabs-sdk/build/outputs/aar/csslabs-sdk-release.aar.sha256
          retention-days: 30
