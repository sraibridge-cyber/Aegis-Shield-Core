name: Android monitor

# Builds the AEGIS Monitor APK and uploads it as a workflow ARTIFACT.
# Lives in ci/ until moved to .github/workflows/android-monitor.yml (see docs/ANDROID.md).
# This workflow never creates a GitHub Release or a tag. Publishing a Release is
# a manual step taken by the repository owner after review (see docs/ANDROID.md).

on:
  push:
    branches: [ feat/aegis-android ]
    paths:
      - 'android-monitor/**'
      - 'public/monitor/**'
      - 'test/monitor/**'
      - 'scripts/check-android-privacy.sh'
      - '.github/workflows/android-monitor.yml'
  workflow_dispatch:
    inputs:
      sign_release:
        description: 'Also build a release APK signed with the repository secrets (artifact only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Monitor tests (hash chain, consent, signal changes)
        run: node --test test/monitor/*.test.mjs

  android-debug:
    runs-on: ubuntu-latest
    needs: web-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Kotlin unit tests and debug build
        run: gradle -p android-monitor testDebugUnitTest assembleDebug --no-daemon
      - name: Privacy checks (manifest, web files, sources, dependencies)
        run: bash scripts/check-android-privacy.sh
      - name: Checksum
        run: |
          cd android-monitor/app/build/outputs/apk/debug
          sha256sum app-debug.apk | tee app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-monitor-debug-apk
          path: |
            android-monitor/app/build/outputs/apk/debug/app-debug.apk
            android-monitor/app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 30

  android-release-signed:
    if: github.event_name == 'workflow_dispatch' && inputs.sign_release
    runs-on: ubuntu-latest
    needs: web-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode the release keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.AEGIS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::AEGIS_KEYSTORE_BASE64 is not set. Add the keystore secrets first (docs/ANDROID.md)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "AEGIS_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Signed release build
        env:
          AEGIS_KEYSTORE_PASSWORD: ${{ secrets.AEGIS_KEYSTORE_PASSWORD }}
          AEGIS_KEY_ALIAS: ${{ secrets.AEGIS_KEY_ALIAS }}
          AEGIS_KEY_PASSWORD: ${{ secrets.AEGIS_KEY_PASSWORD }}
        run: gradle -p android-monitor assembleRelease --no-daemon
      - name: Privacy checks
        run: bash scripts/check-android-privacy.sh
      - name: Checksum
        run: |
          cd android-monitor/app/build/outputs/apk/release
          sha256sum app-release.apk | tee app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-monitor-release-signed-apk
          path: |
            android-monitor/app/build/outputs/apk/release/app-release.apk
            android-monitor/app/build/outputs/apk/release/app-release.apk.sha256
          retention-days: 30
      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
